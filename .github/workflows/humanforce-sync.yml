name: Humanforce roster sync

# Daily scheduling belongs to Windows Task Scheduler at 05:00 AWST.
# No GitHub cron: do not reintroduce a second scheduler.
# Manual diagnostic runs default to a dry run and use the same safe endpoints.
on:
  workflow_dispatch:
    inputs:
      target_date_offset_days:
        description: '0 = today, 1 = tomorrow (Perth date)'
        default: '0'
      dry_run:
        description: 'Preview without database writes'
        type: boolean
        default: true

permissions:
  contents: read
concurrency:
  group: humanforce-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install chromium
      - run: node automation/humanforce-sync.mjs
        env:
          HUMANFORCE_USERNAME: ${{ secrets.HUMANFORCE_USERNAME }}
          HUMANFORCE_PASSWORD: ${{ secrets.HUMANFORCE_PASSWORD }}
          SHIFTFLOW_URL: ${{ secrets.SHIFTFLOW_URL }}
          AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
          TARGET_DATE_OFFSET_DAYS: ${{ inputs.target_date_offset_days }}
          DRY_RUN: ${{ inputs.dry_run }}
